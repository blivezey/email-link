<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 100px; color: #333; background-color: #f9f9f9;">

    <div style="max-width: 400px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <p style="font-size: 18px; margin-bottom: 20px;">Opening your email client...</p>
        
        <!-- Backup button in case their browser has strict pop-up blocks -->
        <a id="emailLink" href="mailto:brittany.livezey@://gmail.com!" 
           style="display: inline-block; padding: 12px 24px; color: white; background-color: #0066cc; text-decoration: none; border-radius: 4px; font-weight: bold;">
           Click Here if App Doesn't Open
        </a>
    </div>

    <script>
        // Forces the browser to immediately open the full mailto link on page load
        window.onload = function() {
            window.location.href = "mailto:brittany.livezey@://gmail.com!";
        };
    </script>

</body>
</html>
