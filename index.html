<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.onload = function() {
            // Decoding the URI string right at execution forces the browser to preserve the subject line parameters
            var mailtoString = decodeURIComponent("mailto:brittany.livezey@://gmail.com like to be a Financial Partner!");
            window.location.href = mailtoString;
        };
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 100px; color: #666; background-color: #f9f9f9;">

    <p style="font-size: 16px;">Opening your email application...</p>
    
    <!-- If the auto-redirect fails or takes too long, they can click this fallback text -->
    <p style="font-size: 14px;">
        If nothing happens, <a href="mailto:brittany.livezey@://gmail.com!" style="color: #0066cc; text-decoration: underline;">click here</a> to draft manually.
    </p>

</body>
</html>
