<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 60px; color: #333; background-color: #f4f6f9; margin: 0;">

    <div style="max-width: 450px; margin: 0 auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 4px solid #0066cc;">

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <a href="mailto:brittany.livezey@://gmail.com!"
